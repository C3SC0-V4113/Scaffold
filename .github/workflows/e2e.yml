# Full CLI E2E suite: real generations, one runner per scenario, in parallel.
#
# The matrix is generated from scripts/e2e/scenarios.mjs (`--list`), so adding
# a scenario there automatically adds a CI job — never hardcode scenario names
# here. Dry-run scenarios are excluded because ci.yml's e2e-quick job already
# runs them on every push/PR.
#
# Triggers:
# - pull_request: runs for EVERY pull request so the e2e-ok summary check always
#   reports. Relevance is decided by the `changes` job below, not by a `paths:`
#   filter — a path-filtered workflow never reports at all on a non-matching pull
#   request, which leaves a required check pending forever.
# - schedule: nightly canary against create-next-app@latest / shadcn@latest —
#   catches upstream drift independent of our own changes and opens an issue
#   on failure.
# - workflow_dispatch: manual run, optionally filtered to specific scenarios.
name: E2E

on:
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Comma-separated scenario names (default: full non-dry-run suite)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Replaces the former `paths:` trigger filter. Same path set, but expressed as
  # a job so the workflow still reports a conclusion on pull requests that do not
  # touch generator code.
  changes:
    name: detect E2E-relevant changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # schedule and workflow_dispatch have no base ref to diff against, and
          # both are meant to exercise the full suite regardless.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'e2e=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD is the merge commit, so diffing it against the base tip yields
          # exactly this pull request's changes, forks included.
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "Changed files:"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(src/|scripts/|package\.json$|package-lock\.json$|\.github/workflows/e2e\.yml$)'; then
            echo 'e2e=true' >> "$GITHUB_OUTPUT"
          else
            echo 'e2e=false' >> "$GITHUB_OUTPUT"
          fi

  matrix:
    name: generate scenario matrix
    needs: changes
    # Must be gated at job level: the jq below errors on an empty matrix, so a
    # skip expressed inside the script would fail the gate instead of passing it.
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      # scripts/cli-e2e.mjs --list-matrix only uses Node builtins, so no npm ci
      # here. It emits real scenarios already expanded to one entry per runner;
      # the fan-out lives in scripts/e2e/scenarios.mjs where it is unit-tested,
      # so this workflow still holds no scenario knowledge of its own.
      - name: List scenarios
        id: list
        env:
          SCENARIO_FILTER: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          raw_file="$(mktemp)"
          matrix_file="$(mktemp)"
          trap 'rm -f "$raw_file" "$matrix_file"' EXIT

          if [ -n "$SCENARIO_FILTER" ]; then
            node scripts/cli-e2e.mjs --list-matrix --scenario "$SCENARIO_FILTER" > "$raw_file"
          else
            node scripts/cli-e2e.mjs --list-matrix > "$raw_file"
          fi

          jq -ce '
            if type != "array" then error("scenario matrix must be a JSON array") else . end
            | if length == 0 then error("scenario matrix is empty") else . end
          ' "$raw_file" > "$matrix_file"
          jq . "$matrix_file"
          {
            printf 'scenarios='
            cat "$matrix_file"
          } >> "$GITHUB_OUTPUT"

  scenario:
    name: ${{ matrix.scenario.jobName }}
    needs: matrix
    runs-on: ${{ matrix.scenario.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.matrix.outputs.scenarios) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup pnpm
        if: matrix.scenario.packageManager == 'pnpm'
        # Third-party actions are pinned to a commit SHA, not a tag. Tags and
        # branches are mutable; a SHA is the only ref an upstream owner cannot
        # repoint after review. Dependabot updates these and rewrites the
        # trailing comment, so the version stays readable.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Bun
        if: matrix.scenario.packageManager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Shared harness cache: package-manager download caches for the generated-app
      # installs. Keyed by runner too — a Linux npm cache is not reusable on
      # Windows, and sharing one key across them thrashes instead of helping.
      #
      # The v2 segment retires every cache written before pnpm's cacheDir moved
      # out of this directory. Those archives still carry `xdg/pnpm/dlx` trees,
      # and the restore-keys prefix would keep pulling them forward forever.
      - name: Restore E2E package cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/purrfold-e2e-cache
          key: e2e-pm-cache-v2-${{ matrix.scenario.os }}-${{ matrix.scenario.packageManager }}-${{ hashFiles('src/versions.json') }}
          restore-keys: |
            e2e-pm-cache-v2-${{ matrix.scenario.os }}-${{ matrix.scenario.packageManager }}-

      - name: Install dependencies
        run: npm ci

      # PURRFOLD_E2E_CACHE_DIR pins the harness cache instead of relying on `~`
      # expanding the same way on three runner families; resolveCacheRoot in
      # scripts/e2e/harness.mjs honors it before falling back to homedir().
      #
      # It lives on the step, not the job: the `runner` context does not exist at
      # job level, and using it there fails the whole workflow at parse time.
      - name: Run scenario
        env:
          PURRFOLD_E2E_CACHE_DIR: ${{ runner.temp }}/purrfold-e2e-cache
        run: node scripts/cli-e2e.mjs --scenario "${{ matrix.scenario.name }}" --require-tty

  # The single stable check name this workflow contributes to branch protection.
  # Scenario jobs cannot be required by name because the matrix names them
  # dynamically, so this job stands in for all of them.
  #
  # `heavy` is deliberately not a dependency: it never runs on pull requests, and
  # its nightly failures are reported by nightly-report instead.
  e2e-ok:
    name: e2e-ok
    # `always()` is load-bearing. Without it this job is skipped whenever the
    # matrix is skipped, and a required check that never reports leaves the pull
    # request pending forever — the exact failure mode the `paths:` filter caused.
    if: always()
    needs: [changes, matrix, scenario]
    runs-on: ubuntu-latest
    steps:
      # `success()` cannot be used here: it treats a legitimately skipped matrix
      # as a non-success. Only failure and cancellation may block the merge.
      - name: Fail when a required E2E job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Dependency results: ${{ join(needs.*.result, ', ') }}"
          echo 'A required E2E job failed or was cancelled.'
          exit 1

      - name: Report gate satisfied
        run: echo "E2E gate satisfied (${{ join(needs.*.result, ', ') }})."

  heavy:
    name: heavy scenarios (network-bound interactive)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Restore E2E package cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/purrfold-e2e
          key: e2e-pm-cache-v2-npm-${{ hashFiles('src/versions.json') }}
          restore-keys: |
            e2e-pm-cache-v2-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run heavy CLI E2E
        run: npm run test:e2e:cli:heavy

  nightly-report:
    name: nightly failure report
    if: always() && github.event_name == 'schedule'
    needs: [scenario, heavy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open an issue for the failed nightly run
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly E2E failure ($(date -u +%F))" \
            --body "The nightly CLI E2E run failed, likely due to upstream drift (create-next-app@latest, shadcn@latest, or a registry change) since no code changed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
